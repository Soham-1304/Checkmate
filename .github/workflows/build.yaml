name: Checkmate App Build

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend_app/**'
      - '.github/workflows/build.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend_app/**'
      - '.github/workflows/build.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mobile-app:
    name: 📱 Build Mobile App (Expo SDK 53)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend_app/package.json

      - name: 📦 Install App Dependencies
        working-directory: frontend_app
        run: npm install

      - name: 🔍 TypeScript Typecheck
        working-directory: frontend_app
        run: npx tsc --noEmit

      - name: 🚀 Export Production Bundles (Android / iOS / Web)
        working-directory: frontend_app
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
        run: npx expo export --output-dir dist

      - name: 📤 Upload App Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkmate-mobile-bundle
          path: frontend_app/dist/
          retention-days: 14

      - name: 🏗️ Trigger EAS Android APK Build (if EXPO_TOKEN configured)
        if: env.EXPO_TOKEN != ''
        working-directory: frontend_app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive
