# Render blueprint: Checkmate AI - Legal Metrology Compliance Engine
# Memory budget: Starter (1GB) with pool_size=3, single worker, supabase storage.
services:
  - type: web
    name: checkmate-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase pooler URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET_EVIDENCE
        value: Bluetick_Image_Store
      - key: SUPABASE_BUCKET_REPORTS
        value: Bluetick_Report_Store
      - key: STORAGE_BACKEND
        value: supabase
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false # comma-separated: admin + officer-app origins
      - key: ML_SERVICE_URL
        sync: false # Optional: Standalone ML microservice URL (e.g. Hugging Face Spaces or Render Docker Service)

